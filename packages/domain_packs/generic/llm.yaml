provider: gemini

defaults:
  temperature: 0.2
  timeout_seconds: 30
  max_output_tokens: 2048

model_chain:
  - id: fast
    model: gemini-2.5-flash-lite
    enabled: true
  - id: strong
    model: gemini-2.5-flash
    enabled: true
    fallback_only: true

retry:
  max_retries_per_model: 2
  backoff_base_ms: 500
  backoff_max_ms: 15000
  retry_on:
    - rate_limit
    - timeout
    - server_error

key_pool:
  source: env
  env_list_var: GEMINI_API_KEYS
  env_primary_var: GEMINI_API_KEY
  cooldown_seconds: 60

blocked_content:
  try_next_model: true
  fallback_message: |
    I couldn't generate a response for that question. Please rephrase or try again later.
  requires_human: false
  escalation_type: provider_blocked

dev:
  allow_missing_key_placeholder: true
  placeholder_prefix: "[DEV PLACEHOLDER]"
